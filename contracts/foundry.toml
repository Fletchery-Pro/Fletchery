[profile.default]
src = "src"
test = "test"
script = "script"
out = "out"
libs = ["lib"]
solc = "0.8.26" # offline? point FOUNDRY_SOLC at a local solc 0.8.26 binary
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
bytecode_hash = "none"
fs_permissions = [{ access = "read-write", path = "../deployments" }]
remappings = [
  "@uniswap/v4-core/=lib/v4-core/",
  "forge-std/=lib/forge-std/src/",
  "solmate/=lib/v4-core/lib/solmate/",
]

[profile.default.fuzz]
runs = 256

[lint]
lint_on_build = false
